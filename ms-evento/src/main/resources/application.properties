# Lee DB_PASSWORD y JWT_SECRET desde el archivo .env de la raiz (al correr desde el IDE)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=ms-evento
server.port=8802

spring.datasource.url=jdbc:oracle:thin:@msfestival_medium?TNS_ADMIN=${TNS_ADMIN_PATH:/app/wallet}
spring.datasource.username=ms_eventos
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.enabled=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

ms.notificaciones.url=${MS_NOTIFICACIONES_URL:http://localhost:8806}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL